[project]
name = "nom-ocr-lab"
version = "0.1.0"
description = "Lab environment for the Confidence-Weighted Nom OCR project course"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "opencv-python-headless>=4.6",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "ultralytics>=8.3,<9",
]

[dependency-groups]
dev = [
    "nbclient>=0.10",
    "pytest>=8.0",
]
# Weeks 6-7: what the supplied LitBTTR checkpoint needs to load. Pins follow the
# environment Dr. Cuong used for nom-ids@project-2026/evaluate.ipynb.
# Install with: uv sync --group recognition
recognition = [
    "einops>=0.8.1,<0.9",
    "pandas>=2.0",
    "pytorch-lightning>=2.5.2,<2.6",
    "torch>=2.7.1,<2.8",
    "torchmetrics>=1.7.4,<2",
    "torchvision>=0.22.1,<0.23",
]

[tool.uv]
package = true
exclude-dependencies = ["opencv-python"]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
